# tmux-text-objects.conf — vim-style text objects in copy-mode-vi.
# Adapted from chathurb/tmux-vilto; vendored here so we don't need a plugin.
# Requires tmux >= 3.2 (jump-to-forward / jump-to-backward).
#
# Usage (in copy mode, cursor inside the object — like vim):
#   i "  i '  i (  i [  i {  i <     select inside delimiters
#   a "  a '  a (  a [  a {  a <     select including delimiters
#   i w  i W  i p                    select word / WORD / paragraph
#   ... then press y to copy (see .tmux.conf binding), or keep moving.
#
# Improvement over vilto: begin-selection is issued by the bindings
# themselves, so you don't need to press v first. Pressing i/a is one-shot:
# tmux drops back to the normal copy-mode-vi keys afterwards.
#
# Limitations (vs real vim): the jump commands don't cross line boundaries,
# so multi-line quoted strings only select within the current line.

# --- operator prefix: i = inner, a = around ---
bind-key -T copy-mode-vi i switch-client -T copy-vi-inner
bind-key -T copy-mode-vi a switch-client -T copy-vi-around

# --- inner blocks: delimiters excluded ---
# (begin-selection; jump back to just after the opener; swap ends; jump
#  forward to just before the closer)
bind-key -T copy-vi-inner '"' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '"' \; send-keys -X other-end \; send-keys -X jump-to-forward -- '"'
bind-key -T copy-vi-inner "'" send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- "'" \; send-keys -X other-end \; send-keys -X jump-to-forward -- "'"
bind-key -T copy-vi-inner '(' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '(' \; send-keys -X other-end \; send-keys -X jump-to-forward -- ')'
bind-key -T copy-vi-inner ')' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '(' \; send-keys -X other-end \; send-keys -X jump-to-forward -- ')'
bind-key -T copy-vi-inner '[' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '[' \; send-keys -X other-end \; send-keys -X jump-to-forward -- ']'
bind-key -T copy-vi-inner ']' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '[' \; send-keys -X other-end \; send-keys -X jump-to-forward -- ']'
bind-key -T copy-vi-inner '{' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '{' \; send-keys -X other-end \; send-keys -X jump-to-forward -- '}'
bind-key -T copy-vi-inner '}' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '{' \; send-keys -X other-end \; send-keys -X jump-to-forward -- '}'
bind-key -T copy-vi-inner '<' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '<' \; send-keys -X other-end \; send-keys -X jump-to-forward -- '>'
bind-key -T copy-vi-inner '>' send-keys -X begin-selection \; send-keys -X other-end \; send-keys -X jump-to-backward -- '<' \; send-keys -X other-end \; send-keys -X jump-to-forward -- '>'

# --- around blocks: delimiters included ---
# (jump-backward/jump-forward are inclusive, unlike the jump-to-* variants)
bind-key -T copy-vi-around '"' send-keys -X begin-selection \; send-keys -X jump-backward -- '"' \; send-keys -X other-end \; send-keys -X jump-forward -- '"'
bind-key -T copy-vi-around "'" send-keys -X begin-selection \; send-keys -X jump-backward -- "'" \; send-keys -X other-end \; send-keys -X jump-forward -- "'"
bind-key -T copy-vi-around '(' send-keys -X begin-selection \; send-keys -X jump-backward -- '(' \; send-keys -X other-end \; send-keys -X jump-forward -- ')'
bind-key -T copy-vi-around ')' send-keys -X begin-selection \; send-keys -X jump-backward -- '(' \; send-keys -X other-end \; send-keys -X jump-forward -- ')'
bind-key -T copy-vi-around '[' send-keys -X begin-selection \; send-keys -X jump-backward -- '[' \; send-keys -X other-end \; send-keys -X jump-forward -- ']'
bind-key -T copy-vi-around ']' send-keys -X begin-selection \; send-keys -X jump-backward -- '[' \; send-keys -X other-end \; send-keys -X jump-forward -- ']'
bind-key -T copy-vi-around '{' send-keys -X begin-selection \; send-keys -X jump-backward -- '{' \; send-keys -X other-end \; send-keys -X jump-forward -- '}'
bind-key -T copy-vi-around '}' send-keys -X begin-selection \; send-keys -X jump-backward -- '{' \; send-keys -X other-end \; send-keys -X jump-forward -- '}'
bind-key -T copy-vi-around '<' send-keys -X begin-selection \; send-keys -X jump-backward -- '<' \; send-keys -X other-end \; send-keys -X jump-forward -- '>'
bind-key -T copy-vi-around '>' send-keys -X begin-selection \; send-keys -X jump-backward -- '<' \; send-keys -X other-end \; send-keys -X jump-forward -- '>'

# --- word / WORD / paragraph ---
bind-key -T copy-vi-inner w send-keys -X begin-selection \; send-keys -X cursor-right \; send-keys -X previous-word \; send-keys -X other-end \; send-keys -X cursor-left \; send-keys -X next-word-end
bind-key -T copy-vi-inner W send-keys -X begin-selection \; send-keys -X cursor-right \; send-keys -X previous-space \; send-keys -X other-end \; send-keys -X cursor-left \; send-keys -X next-space-end
bind-key -T copy-vi-inner p send-keys -X begin-selection \; send-keys -X previous-paragraph \; send-keys -X other-end \; send-keys -X next-paragraph