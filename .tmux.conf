set -sg escape-time 0
set -g focus-events on
set -g mode-keys vi
set -g extended-keys on
set -s set-clipboard on
setw -g mode-keys vi
set -g status-left-length 50  # Increase from default (10) to show full session names
# Yank selection to the system clipboard and leave copy-mode
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "~/pwl-dotfiles/scripts/clipcopy"

# (Optional) same for the Emacs key-table, if you ever use it
bind-key -T copy-mode     y send -X copy-pipe-and-cancel "~/pwl-dotfiles/scripts/clipcopy"
bind-key -T copy-mode     G send -X copy-pipe-and-cancel "~/pwl-dotfiles/scripts/clipcopy"

# In tmux.conf
bind-key -n C-M-j switch-client -n
bind-key -n C-M-k switch-client -p

bind-key n switch-client -n
bind-key p switch-client -p

bind-key C-y run-shell "~/pwl-dotfiles/scripts/capture_pane.sh"
set-hook -g after-new-session  'run-shell -b "~/pwl-dotfiles/scripts/tmux-map.sh #{pane_tty} #{client_pid}"'
set-hook -g after-new-window   'run-shell -b "~/pwl-dotfiles/scripts/tmux-map.sh #{pane_tty} #{client_pid}"'
set-hook -g after-split-window 'run-shell -b "~/pwl-dotfiles/scripts/tmux-map.sh #{pane_tty} #{client_pid}"'
set-hook -g client-attached    'run-shell -b "~/pwl-dotfiles/scripts/tmux-map.sh #{pane_tty} #{client_pid}"'

# ==========================================================================
# dwm-style tiling: window = tag (1-9), pane = client, main-vertical = tile.
# Modifier is Option-as-Meta (M-); on macOS set option_as_alt in the terminal
# (Alacritty: [window] option_as_alt = "Both"). dwm's MODKEY is Super, so these
# Alt chords do not collide with real dwm when this config is used inside st.
# ==========================================================================

# Tags line up with the number keys, master column matches dwm's mfact 0.55.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g main-pane-width 55%

# Re-tile into master/stack whenever a pane is added (dwm auto-tiles; tmux does not).
set-hook -ga after-split-window 'select-layout main-vertical'

# --- clients (panes) ---
bind -n M-j select-pane -t :.+
bind -n M-k select-pane -t :.-
bind -n M-Enter split-window           # spawn (after-split-window hook re-tiles)
bind -n M-z swap-pane -d -t '{top-left}'  # zoom: promote focused pane to master
bind -n M-C kill-pane                  # Option+Shift+c

# --- layouts ---
bind -n M-t select-layout main-vertical   # tile
bind -n M-m resize-pane -Z                # monocle (fullscreen the focused pane)
bind -n M-space next-layout
bind -n M-h resize-pane -L 5              # shrink master
bind -n M-l resize-pane -R 5              # grow master

# --- tags (windows) ---
bind -n M-Tab last-window
bind -n M-1 run-shell 'tmux select-window -t :1 2>/dev/null || tmux new-window -t :1'
bind -n M-2 run-shell 'tmux select-window -t :2 2>/dev/null || tmux new-window -t :2'
bind -n M-3 run-shell 'tmux select-window -t :3 2>/dev/null || tmux new-window -t :3'
bind -n M-4 run-shell 'tmux select-window -t :4 2>/dev/null || tmux new-window -t :4'
bind -n M-5 run-shell 'tmux select-window -t :5 2>/dev/null || tmux new-window -t :5'
bind -n M-6 run-shell 'tmux select-window -t :6 2>/dev/null || tmux new-window -t :6'
bind -n M-7 run-shell 'tmux select-window -t :7 2>/dev/null || tmux new-window -t :7'
bind -n M-8 run-shell 'tmux select-window -t :8 2>/dev/null || tmux new-window -t :8'
bind -n M-9 run-shell 'tmux select-window -t :9 2>/dev/null || tmux new-window -t :9'

# Move focused pane to tag N (Option+Shift+digit -> shifted symbol), staying on
# the current tag. join-pane moves into an existing tag; break-pane creates it.
bind -n 'M-!' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :1 2>/dev/null || tmux break-pane -d -t :1; tmux select-layout -t :1 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-@' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :2 2>/dev/null || tmux break-pane -d -t :2; tmux select-layout -t :2 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-#' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :3 2>/dev/null || tmux break-pane -d -t :3; tmux select-layout -t :3 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-$' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :4 2>/dev/null || tmux break-pane -d -t :4; tmux select-layout -t :4 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-%' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :5 2>/dev/null || tmux break-pane -d -t :5; tmux select-layout -t :5 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-^' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :6 2>/dev/null || tmux break-pane -d -t :6; tmux select-layout -t :6 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-&' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :7 2>/dev/null || tmux break-pane -d -t :7; tmux select-layout -t :7 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-*' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :8 2>/dev/null || tmux break-pane -d -t :8; tmux select-layout -t :8 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
bind -n 'M-(' run-shell 'src=$(tmux display -p "#{window_index}"); tmux join-pane -t :9 2>/dev/null || tmux break-pane -d -t :9; tmux select-layout -t :9 main-vertical; tmux select-window -t ":$src" 2>/dev/null'
